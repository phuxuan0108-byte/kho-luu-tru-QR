<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale5.0">
    <title>Dashboard Quét Mã QR - Đồ Án IoT</title>
    <!-- Thư viện MQTT.js qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .status { text-align: center; font-weight: bold; margin-bottom: 15px; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hệ Thống Giám Sát Quét Mã QR Trực Tuyến</h2>
    <div id="status" class="status">Trạng thái: Đang kết nối tới MQTT Cloud...</div>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Thời gian quét</th>
                <th>Nội dung mã hàng / Dữ liệu</th>
            </tr>
        스와 -->
        <tbody id="log-table">
            <!-- Dữ liệu quét sẽ được tự động thêm vào đây -->
        </tbody>
    </table>
</div>

<script>
    // --- CẤU HÌNH THÔNG SỐ MQTT CỦA BẠN ---
    const brokerUrl = 'wss://mqtt-ce2.iotlabs.vn:443/mqtt'; // Dùng cổng WSS cho trình duyệt web
    const topic = 'devices/iotlabs_a678b26967807';
    const options = {
        clientId: 'web_client_' + Math.random().toString(16.substring(2, 8)),
        username: 'device_a678b26967807',
        password: '12d8b553344992ab78dd5d81828eb35f',
        clean: true
    };

    const statusDiv = document.getElementById('status');
    const tableBody = document.getElementById('log-table');
    let stt = 1;

    // Kết nối tới MQTT Broker
    console.log("Đang kết nối...");
    const client = mqtt.connect(brokerUrl, options);

    client.on('connect', function () {
        statusDiv.innerHTML = "Trạng thái: Đã kết nối thành công tới Cloud (Sẵn sàng nhận dữ liệu)";
        statusDiv.style.color = "green";
        client.subscribe(topic, function (err) {
            if (!err) {
                console.log("Đã đăng ký theo dõi topic thành công!");
            }
        });
    });

    client.on('error', function (error) {
        statusDiv.innerHTML = "Trạng thái: Lỗi kết nối MQTT!";
        statusDiv.style.color = "red";
        console.log(error);
    });

    // Khi có tin nhắn (dữ liệu quét QR) gửi tới từ thiết bị
    client.on('message', function (topic, message) {
        let msgStr = message.toString();
        console.log("Nhận được dữ liệu: " + msgStr);

        // Tách dữ liệu hiển thị (giả sử dữ liệu nhận được có định dạng chuỗi)
        let thoiGianNhan = new Date().toLocaleString();

        // Thêm một dòng mới vào bảng hiển thị
        let newRow = `<tr>
            <td>${stt++}</td>
            <td>${thoiGianNhan}</td>
            <td><b>${msgStr}</b></td>
        </tr>`;
        
        tableBody.insertAdjacentHTML('afterbegin', newRow); // Đưa dòng mới lên đầu bảng
    });
</script>

</body>
</html>
